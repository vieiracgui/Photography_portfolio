<!doctype html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 👉 Título e descrição padrão. Os valores por página são definidos em src/content/site.ts -->
    <title>Guilherme Vieira — Fotografia</title>
    <meta
      name="description"
      content="Marketing, conteúdo e fotografia. Portfólio de Guilherme Vieira."
    />
    <meta name="theme-color" content="#fcfbf8" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Guilherme Vieira — Fotografia" />
    <meta
      property="og:description"
      content="Marketing, conteúdo e fotografia. Portfólio de Guilherme Vieira."
    />
    <meta property="og:image" content="/images/og-cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Aplica o tema salvo ANTES do React montar.
      Sem isso o site pisca branco antes de virar escuro.
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("portfolio-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : prefersDark
                ? "dark"
                : "light";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
        } catch (error) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
