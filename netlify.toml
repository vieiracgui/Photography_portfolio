# Configuração de deploy do Netlify.
# O Netlify lê este arquivo automaticamente ao conectar o repositório.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: qualquer rota (ex.: /projeto/meu-projeto) cai no index.html
# e o React Router resolve a página. Sem isso, o F5 dá 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache longo para os arquivos com hash gerados pelo Vite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens que você troca com frequência: cache curto e revalidação.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
